name: Unzip uploaded archives

on:
  workflow_dispatch:   # manual trigger only (Actions tab → Run workflow)

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract all ZIP files
        run: |
          shopt -s globstar nullglob
          zips=(**/*.zip **/*.ZIP)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP files found in the repository."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Extracting $z"
            dest="$(dirname "$z")"
            if unzip -o "$z" -d "$dest"; then
              rm -f "$z"
              echo "Removed $z after successful extraction."
            else
              echo "Extraction failed for $z — leaving it in place."
            fi
          done

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-unzip uploaded archives"
            git push
          fi
